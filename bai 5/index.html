<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Bai 5</title>
        <link
            rel="stylesheet"
            href="style.css"
            type="text/css"
        />
        <style>
            /* Loai 2: internal style */
            h2 {
                /* color dung de qui dinh mau chu */
                color: red;
            }
            #tieuDe {
                color: blue;
            }
        </style>
    </head>
    <body>
        <!-- I. -->
        <!-- Kieu 1 viet style trong the -->
        <!-- Loai 1: Inline style -->
        <h1 style="color: blue">HUMG</h1>
        <!-- Kieu 2 viet ngoai the -->
        <h2>Truong dai hoc Mo - Dia Chat</h2>
        <h3>Lop phat trien ung dung web 03</h3>
        <!-- II. Selector -->
        <!-- cach 1: Dung ten the -->
        <!-- cach 2: Dung id -->
        <h2 id="tieuDe">Truong dai hoc Mo - Dia Chat</h2>
        <!-- cach 3: Dung class -->
        <h2
            id="tieude"
            class="tieude"
        >
            Truong dai hoc Mo - Dia Chat
        </h2>
        <h3 class="tieude2">Lop phat trien ung dung web 03</h3>
    </body>
</html>
