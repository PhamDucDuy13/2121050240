<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <link
            rel="stylesheet"
            href="style.css"
        />
        <title>Netflix</title>
    </head>
    <body style="height: 1000px">
        <header>
            <nav>
                <ul class="ul-link">
                    <img
                        class="image"
                        src="/Bai 8/netflix.svg"
                        alt=""
                    />
                    <a
                        class="link"
                        href="!#"
                    >
                        <li class="list-item">Trang Chủ</li>
                    </a>
                    <a
                        class="link"
                        href="!#"
                    >
                        <li class="list-item">Nhân Vật</li>
                    </a>
                    <a
                        class="link"
                        href="!#"
                    >
                        <li class="list-item">Series</li>
                    </a>
                    <a
                        class="link"
                        href="!#"
                    >
                        <li class="list-item">Phim</li>
                    </a>
                    <a
                        class="link"
                        href="!#"
                    >
                        <li class="list-item">Mới & Phổ Biến</li>
                    </a>
                    <a
                        class="link"
                        href="!#"
                    >
                        <li class="list-item">Netflix của tôi</li>
                    </a>
                    <a
                        class="link"
                        href="!#"
                    >
                        <li class="list-item">Duyệt tìm theo ngôn ngữ</li>
                    </a>
                </ul>
                <div class="funcion">
                    <div class="search">Tim Kiem</div>
                    <div class="data">
                        <img
                            src="/bai 13/kids.png"
                            alt=""
                        />
                    </div>
                </div>
            </nav>
        </header>
        <div class="banner">
            <img
                class="banner-img"
                src="/bai 13/banner.png"
                alt=""
            />
            <iframe
                id="video"
                src="https://www.youtube.com/embed/3BeYkAKzz4g?si=HtAgaCPRAfv2jlzb"
                title="YouTube video player"
                frameborder="0"
                allow="
                    accelerometer;
                    autoplay;
                    clipboard-write;
                    encrypted-media;
                    gyroscope;
                    picture-in-picture;
                    web-share;
                "
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen
            ></iframe>
            <div id="video-overlay"></div>
        </div>
        <div class="category">
            <div class="name-category">
                <h4>Có thể bạn chưa xem</h4>
            </div>
            <div class="list-movie">
                <div class="movie">
                    <img
                        src="/bai 13/bleach.jpg"
                        alt=""
                        class="poster"
                    />
                    <img
                        src="/bai 13/shreck.jpg"
                        alt=""
                        class="poster"
                    />
                    <img
                        src="/bai 13/minions.jpg"
                        alt=""
                        class="poster"
                    />
                    <img
                        src="/bai 13/zootopia.jpg"
                        alt=""
                        class="poster"
                    />
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
