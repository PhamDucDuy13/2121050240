        <script>
            //ham date
            var homNay = new Date();
            document.writeln("<br>");
            document.write(homNay);

            var ngay = new Date("1/6/ 2026");
            document.writeln("<br>");
            document.write(ngay);

            var namNay = homNay.getFullYear();
            document.writeln("<br>");
            document.write(namNay);

            var thangNay = homNay.getMonth() + 1;
            document.writeln("<br>");
            document.write(thangNay);

            var ngayHomNay = homNay.getDate();
            document.writeln("<br>");
            document.write(ngayHomNay);

            var ngayThu = homNay.getDay() + 1;
            document.writeln("<br>");
            document.write(ngayThu);

            document.writeln("<br>");
            document.writeln(
                "Hom nay la thu" +
                    ngayThu +
                    "ngay " +
                    ngayHomNay +
                    "Thang" +
                    thangNay +
                    "Nam" +
                    namNay,
            );

            var mangSo = [1, 2, 3, 4, 5];
            document.writeln("<br>");
            document.writeln(mangSo[2]);

            document.writeln("<br>");
            document.writeln(mangSo.length);

            var mang = [1, 2, 3, 4, 5, "Diem Quynh", "Duy"];
            document.writeln("<br>");
            document.writeln(mang[5]);

            var d = mang.concat(mangSo, mangTen);
            document.writeln("<br>");
            document.writeln(d.join("-"));
            //dung join thi se thanh kieu chuoi (ko con la mang nx)

            document.writeln("<br>");

            document.writeln("<br>");
            document.write(thongTinSinhVien.ten);
            document.writeln("<br>");
            document.write(thongTinSinhVien.queQuan.thanhPho);
            tuoi = namNay - thongTinSinhVien.namSinh;

            console.log(thongTinSV);

            //so sanh logic
            // == != > <
            // voi TH === :so sanh gia tri va kieu du lieu
            var so1 = 10;
            var so2 = "10";
            document.writeln("<br>");
            document.writeln(5 == 10);

            document.writeln("<br>");
            document.writeln(5 != 10);

            document.writeln("<br>");
            document.writeln(5 <= 10);
            document.writeln("<br>");
            document.writeln(5 >= 10);

            document.writeln("<br>");
            document.writeln(5 === 10);

            //&& ||
