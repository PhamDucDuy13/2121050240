        <div>
            So Tuoi:

            />
        </div>
        <script>
            // events
            function tinhDiem() {
                //diemA
                var a = parseFloat(document.getElementById("diemA").value);
                //diem B
                var b = parseFloat(document.getElementById("diemB").value);
                //diem C
                var c = parseFloat(document.getElementById("diemC").value);

                document.getElementById("ketQua").value = tinhDiemChu(a, b, c);

            // BTVN
            //viet ham tinh diem chu dua tren 3 dau diem(A,B,C)
            //Tong = A*0.6+B*0.3+c*0.1 => diem chu tuong ung
            // var A = Number(prompt("nhap diem A"));
            // var B = Number(prompt("nhap diem B"));
            // var C = Number(prompt("nhap diem C"));
            function tinhDiemChu(a, b, c) {
                var tong = a * 0.6 + b * 0.3 + c * 0.1;
                var kq = "";

                if (tong >= 8 && tong <= 10) {
                    return "A";
                } else if (tong >= 6 && tong < 8) {
                    return "B";
                } else if (tong >= 5 && tong < 6) {
                    return "C";
                } else if (tong >= 4 && tong < 5) {
                    return "D";
                } else if (tong > 0 && tong < 4) {
                    return "F";
                } else {
                    return "Diem ko hop le";
                }
                return kq;
            }

            function tinhTuoi(namSinh) {
                var namNay = new Date().getFullYear();
                var tuoi = namNay - namSinh;
                var st = "";

                if (tuoi > 0 && tuoi <= 100) {
                    return tuoi;
                } else {
                    return "tuoi ko hop le";
                }
                return st;
            }
            function hienThiTuoi() {
                var namSinh = parseInt(
                    document.getElementById("namSinh").value,
                );
                document.getElementById("soTuoi").value = tinhTuoi(namSinh);
            }
